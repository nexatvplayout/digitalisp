<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telas</title>
<link rel="stylesheet" href="estilo.css">
<!-- o desenho da prévia do painel (gerado por apps-tv/scripts/previa.js) e os ajustes dele na TV -->
<link rel="stylesheet" href="previa.css">
<link rel="stylesheet" href="previa-tv.css">
</head>
<body>
<!-- Só o conteúdo do cliente aparece. Nenhum texto com o nome do app ou do sistema (white-label). -->
<div id="conteudo"></div>
<div id="aovivo"></div>

<div id="abertura" class="camada">
  <img class="logo-revenda" alt="" hidden>
</div>

<div id="cadastro" class="camada" hidden>
  <img class="logo-revenda" alt="" hidden>
  <div id="cad-codigo" class="codigo"></div>
  <input id="cad-chave" class="chave" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" hidden>
  <div id="cad-texto" class="instrucao"></div>
  <div id="cad-diag" class="diag-linha"></div>
</div>

<div id="espera" class="camada" hidden>
  <img class="logo-revenda" alt="" hidden>
  <div class="barra"><div id="espera-barra"></div></div>
  <div id="espera-texto" class="instrucao"></div>
</div>

<div id="semrede" class="camada" hidden>
  <img class="logo-revenda" alt="" hidden>
  <div class="instrucao">Sem internet. A tela volta sozinha quando a conexão voltar.</div>
</div>

<div id="desligada" hidden></div>

<div id="alerta" hidden>
  <div id="alerta-cabeca"></div>
  <div id="alerta-titulo"></div>
  <div id="alerta-texto"></div>
</div>

<div id="diag" hidden>
  <div id="diag-lista"></div>
</div>

<script src="js/config-padrao.js"></script>
<script src="js/sha256.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/fila.js"></script>
<script src="js/armazem.js"></script>
<script src="js/plataforma.js"></script>
<script src="js/rede.js"></script>
<script src="js/previa.js"></script>
<script src="js/aovivo.js"></script>
<script src="js/tela.js"></script>
<script src="js/app.js"></script>
</body>
</html>
