<!DOCTYPE html>

<title>DIGITAL ISP · vídeo ao vivo</title>
<!-- DIGITAL ISP: a zona de vídeo das telas tocando um vídeo ao vivo do YouTube (o app abre esta página na zona).
     ?v=<id do vídeo> ou ?c=<id do canal UC…> (a live que estiver no ar); &vol=0..100; &mute=1. -->
<style>
  html, body, #p { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #p iframe { width: 100%; height: 100%; border: 0; display: block; }
  #aviso { position: fixed; inset: 0; background: #000; display: none; align-items: center; justify-content: center; padding: 6%; color: #cfd8e3; font: 600 4vmin/1.3 system-ui, sans-serif; text-align: center; }
</style>
</head>
<body>
<div id="p"></div>
<div id="aviso"></div>
<script src="youtube.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
