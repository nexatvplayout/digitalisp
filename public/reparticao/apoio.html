<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Apoio</title>
  <link rel="stylesheet" href="/reparticao/reparticao.css">
  <link rel="stylesheet" href="/reparticao/sala.css">
</head>
<body>
  <header class="r-bar">
    <span class="r-brand">NEXA Telas · Apoio</span>
    <span class="r-bar-office"><b id="office"></b></span>
    <span class="r-bar-telas" id="count" aria-live="polite"></span>
    <span class="r-bar-clock" id="clock" aria-label="Hora"></span>
  </header>
  <main class="r s">
    <p class="r-err" id="err" role="alert" hidden></p>
    <p class="r-ok" id="ok" role="status" hidden></p>
    <section class="r-card" aria-labelledby="hWho">
      <h1 id="hWho" class="s-h">Pedidos das salas</h1>
      <label class="r-field"><span>Seu nome (aparece em "quem aceitou")</span><input type="text" id="who" maxlength="40" autocomplete="off" placeholder="Ex.: José, maqueiro"></label>
      <ul class="r-list" id="list"></ul>
      <p class="r-dim" id="empty">Nenhum pedido hoje.</p>
    </section>
    <p class="r-dim">Este endereço só vê e atende os pedidos de apoio das salas. Não chama senhas e não abre o painel da repartição.</p>
  </main>
  <script type="module" src="/reparticao/apoio.js"></script>
</body>
</html>
