<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Acompanhar a senha</title>
  <link rel="stylesheet" href="/reparticao/acompanhar.css">
</head>
<body>
  <main class="a">
    <p class="a-office" id="office"></p>
    <p class="a-label">Senha</p>
    <p class="a-code" id="code">—</p>
    <p class="a-status" id="status" aria-live="polite"></p>
    <p class="a-called" id="called" hidden aria-live="assertive"></p>
    <p class="a-line" id="stage"></p>
    <p class="a-line" id="position"></p>
    <p class="a-line" id="risk" hidden></p>
    <p class="a-line a-est" id="estimate" hidden></p>
    <p class="a-err" id="err" role="alert" hidden></p>
    <p class="a-foot">Esta página atualiza sozinha e vale só hoje. Ela não mostra nome nem motivo do atendimento.</p>
  </main>
  <script type="module" src="/reparticao/acompanhar.js"></script>
</body>
</html>
